<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Conference talks for our Sunday discussions</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@600;700&family=EB+Garamond:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1b2436;
  --paper: #f5f7fa;
  --card: #ffffff;
  --navy: #1e3456;
  --navy-soft: #e2e9f3;
  --gold: #bf942a;
  --gold-soft: #f6ecd2;
  --walnut: #5b3b22;
  --walnut-dark: #3e2715;
  --tile: #fffdf8;
  --sage: #4f7a5e;
  --mute: #5b6475;
  --line: #d8dde6;
  --danger: #a33d2b;
  --sans: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --serif: "Source Serif 4", Georgia, serif;
  --hymnal: "EB Garamond", Garamond, Georgia, serif;
  --board: "Barlow Condensed", "Arial Narrow", sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #e8ecf3; --paper: #111826; --card: #1a2333; --navy: #a9c6e8; --navy-soft: #233149;
    --gold: #e0b84e; --gold-soft: #3a3120; --walnut: #4a2f1b; --walnut-dark: #2f1d10; --tile: #f4efe4;
    --sage: #8dbb9c; --mute: #a5aebd; --line: #2c3749; --danger: #e38b76;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.5 var(--sans);
  padding: env(safe-area-inset-top, 0) 0 calc(140px + env(safe-area-inset-bottom, 0));
}
main { max-width: 660px; margin: 0 auto; padding: 0 20px; }
a { color: var(--navy); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; border-radius: 6px; }

/* Header with organ pipes */
header.top { text-align: center; padding: 18px 0 26px; }
.pipes { display: block; width: 100%; max-width: 420px; height: 76px; margin: 0 auto 10px; }
.pipes rect { fill: var(--gold); transform-box: fill-box; transform-origin: bottom; animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
.pipes .mouth { fill: var(--walnut); opacity: .55; animation: none; }
@keyframes rise { from { transform: scaleY(.25); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
header.top .kicker { margin: 0; color: var(--mute); font-size: 15px; }
h1 { font: 600 33px/1.12 var(--hymnal); margin: 6px 0 0; color: var(--navy); }
h2 { font: 600 26px/1.2 var(--hymnal); margin: 0 0 6px; color: var(--navy); }
.program { color: var(--gold); font: 700 15px var(--sans); margin: 0 0 2px; }
.lead { margin: 0 0 22px; color: var(--mute); }

.primary {
  background: var(--navy); color: #fff; border: 0; border-radius: 10px;
  padding: 13px 20px; font-weight: 700; min-height: 48px; white-space: nowrap;
}
@media (prefers-color-scheme: dark) { .primary { color: #0f1624; } }
.primary:disabled { opacity: .4; cursor: not-allowed; }
.quiet { background: none; border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 16px; min-height: 46px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 24px 22px; }
.panel p { margin: 0 0 14px; }
.panel p:last-child { margin-bottom: 0; }
.purse-line { display: flex; align-items: center; gap: 12px; background: var(--gold-soft); border-radius: 12px; padding: 12px 14px; margin: 0 0 16px; }
.purse-line svg { flex: none; }
.toggle { display: flex; gap: 12px; align-items: flex-start; margin: 18px 0 22px; }
.toggle input { width: 22px; height: 22px; margin-top: 2px; accent-color: var(--navy); flex: none; }
.toggle small { display: block; color: var(--mute); }

/* Talk cards, styled like a conference program entry */
.talk { background: var(--card); border: 1px solid var(--line); border-left: 5px solid var(--gold); border-radius: 14px; padding: 18px 18px 16px; margin: 0 0 14px; }
.talk h3 { font: 600 23px/1.2 var(--hymnal); margin: 0; color: var(--navy); }
.who { color: var(--mute); font-size: 15px; margin: 4px 0 10px; }
.summary { font: 400 17.5px/1.62 var(--serif); margin: 0 0 10px; }
.seed { font-size: 15px; color: var(--mute); margin: 0 0 12px; }
.seed b { color: var(--ink); }
.read { font-size: 15px; }
.sort { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
.sort button { border: 1.5px solid var(--line); background: none; border-radius: 10px; min-height: 46px; font-weight: 700; }
.sort button[aria-pressed="true"][data-v="yes"] { background: var(--sage); border-color: var(--sage); color: #fff; }
.sort button[aria-pressed="true"][data-v="maybe"] { background: var(--navy-soft); border-color: var(--navy); }
.sort button[aria-pressed="true"][data-v="pass"] { border-color: var(--mute); color: var(--mute); text-decoration: line-through; }
.pinned { margin-top: 12px; color: var(--sage); font-weight: 700; font-size: 15px; }

/* Spend rows */
.group { font: 600 20px var(--hymnal); color: var(--navy); margin: 26px 0 10px; }
.row { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.row h3 { font: 600 19px/1.25 var(--hymnal); margin: 0 0 10px; color: var(--navy); }
.controls { display: flex; align-items: center; gap: 10px; }
.pips { display: flex; gap: 5px; }
.pip {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--gold); background: none;
  font: 700 15px var(--sans); color: var(--gold); display: grid; place-items: center; transition: transform .15s;
}
.pip.on { background: var(--gold); color: #fff; box-shadow: inset 0 0 0 3px rgba(255,255,255,.28); }
@media (prefers-color-scheme: dark) { .pip.on { color: #1d1606; } }
.pip:active { transform: scale(.92); }
.keeper { margin-left: auto; border: 1.5px solid var(--line); background: none; border-radius: 999px; padding: 6px 11px; min-height: 36px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.keeper[aria-pressed="true"] { border-color: var(--gold); background: var(--gold-soft); color: var(--ink); }
.keeper:disabled { opacity: .4; cursor: not-allowed; }
details.passed summary { cursor: pointer; color: var(--navy); font-weight: 700; margin: 26px 0 10px; }

/* Review */
.tally { list-style: none; padding: 0; margin: 0 0 18px; }
.tally li { display: flex; gap: 14px; align-items: baseline; padding: 11px 0; border-bottom: 1px solid var(--line); }
.tally .n { font: 700 24px var(--board); color: var(--gold); min-width: 2ch; text-align: right; }
.tally .t { font: 500 19px/1.3 var(--hymnal); }
.tally .k { color: var(--gold); font: 700 14px var(--sans); display: block; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
.note { font-size: 15px; color: var(--mute); }
.error { color: var(--danger); font-weight: 700; }

/* Done */
.well { text-align: center; padding: 34px 22px; }
.well blockquote { font: italic 500 25px/1.3 var(--hymnal); color: var(--navy); margin: 0 0 4px; }
.well cite { display: block; font-style: normal; color: var(--mute); font-size: 14px; margin-bottom: 20px; }
.shower { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.shower i { position: absolute; top: -24px; width: 16px; height: 16px; border-radius: 50%; background: var(--gold); box-shadow: inset 0 0 0 3px rgba(255,255,255,.35); animation: fall 2.4s ease-in forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .2; } }

/* The hymn board */
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0)); box-shadow: 0 -8px 22px rgba(18, 24, 38, .08); z-index: 4; }
.bar .in { max-width: 660px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
.board {
  background: var(--walnut); border: 3px solid var(--walnut-dark); border-radius: 6px;
  padding: 6px 8px 5px; display: flex; flex-direction: column; align-items: center; flex: none;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
}
.tiles { display: flex; gap: 3px; }
.tile { background: var(--tile); color: #1b2436; font: 700 26px/1 var(--board); width: 26px; height: 34px; display: grid; place-items: center; border-radius: 2px; box-shadow: 0 1px 0 rgba(0,0,0,.35); }
.board small { color: #f1e5cf; font: 600 12px/1.3 var(--sans); margin-top: 3px; letter-spacing: .02em; }
.msg { flex: 1; min-width: 0; font-size: 14.5px; color: var(--mute); line-height: 1.35; }
.msg b { color: var(--ink); }
.warn { color: var(--danger); font-weight: 700; }
@media (prefers-reduced-motion: reduce) { .pipes rect, .shower i, .pip { animation: none !important; transition: none; } .shower { display: none; } }

footer.credit { max-width: 660px; margin: 34px auto 0; padding: 0 20px; color: var(--mute); font-size: 14px; text-align: center; }
.hidden { display: none !important; }
</style>
</head>
<body>
<main id="app" aria-live="polite">
  <header class="top">
    <svg class="pipes" viewBox="0 0 420 76" aria-hidden="true"><rect x="0.0" y="41.8" width="24.3" height="34.2" rx="2" style="animation-delay:0.28s"/><rect class="mouth" x="6.1" y="63.0" width="12.1" height="3" rx="1.5"/><rect x="28.3" y="34.2" width="24.3" height="41.8" rx="2" style="animation-delay:0.24s"/><rect class="mouth" x="34.3" y="60.1" width="12.1" height="3" rx="1.5"/><rect x="56.5" y="27.0" width="24.3" height="49.0" rx="2" style="animation-delay:0.20s"/><rect class="mouth" x="62.6" y="57.4" width="12.1" height="3" rx="1.5"/><rect x="84.8" y="20.2" width="24.3" height="55.8" rx="2" style="animation-delay:0.16s"/><rect class="mouth" x="90.9" y="54.8" width="12.1" height="3" rx="1.5"/><rect x="113.1" y="13.9" width="24.3" height="62.1" rx="2" style="animation-delay:0.12s"/><rect class="mouth" x="119.1" y="52.4" width="12.1" height="3" rx="1.5"/><rect x="141.3" y="8.2" width="24.3" height="67.8" rx="2" style="animation-delay:0.08s"/><rect class="mouth" x="147.4" y="50.2" width="12.1" height="3" rx="1.5"/><rect x="169.6" y="3.3" width="24.3" height="72.7" rx="2" style="animation-delay:0.04s"/><rect class="mouth" x="175.7" y="48.4" width="12.1" height="3" rx="1.5"/><rect x="197.9" y="0.0" width="24.3" height="76.0" rx="2" style="animation-delay:0.00s"/><rect class="mouth" x="203.9" y="47.1" width="12.1" height="3" rx="1.5"/><rect x="226.1" y="3.3" width="24.3" height="72.7" rx="2" style="animation-delay:0.04s"/><rect class="mouth" x="232.2" y="48.4" width="12.1" height="3" rx="1.5"/><rect x="254.4" y="8.2" width="24.3" height="67.8" rx="2" style="animation-delay:0.08s"/><rect class="mouth" x="260.5" y="50.2" width="12.1" height="3" rx="1.5"/><rect x="282.7" y="13.9" width="24.3" height="62.1" rx="2" style="animation-delay:0.12s"/><rect class="mouth" x="288.7" y="52.4" width="12.1" height="3" rx="1.5"/><rect x="310.9" y="20.2" width="24.3" height="55.8" rx="2" style="animation-delay:0.16s"/><rect class="mouth" x="317.0" y="54.8" width="12.1" height="3" rx="1.5"/><rect x="339.2" y="27.0" width="24.3" height="49.0" rx="2" style="animation-delay:0.20s"/><rect class="mouth" x="345.3" y="57.4" width="12.1" height="3" rx="1.5"/><rect x="367.5" y="34.2" width="24.3" height="41.8" rx="2" style="animation-delay:0.24s"/><rect class="mouth" x="373.5" y="60.1" width="12.1" height="3" rx="1.5"/><rect x="395.7" y="41.8" width="24.3" height="34.2" rx="2" style="animation-delay:0.28s"/><rect class="mouth" x="401.8" y="63.0" width="12.1" height="3" rx="1.5"/></svg>
    <p class="kicker">October 2026 general conference</p>
    <h1>Which talks should we discuss this season?</h1>
  </header>
  <div id="screen"><p class="note">Loading your ballot…</p></div>
</main>
<footer class="credit">Summaries were drafted with AI help and reviewed by Jason Swigert. Each links to the full talk; please read the talk itself before you decide.</footer>
<div class="bar hidden" id="bar"><div class="in">
  <div class="board" id="board" aria-hidden="true"><span class="tiles" id="tiles"></span><small id="boardLabel"></small></div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <button class="primary" id="next"></button>
</div></div>

<script>
// ---- Settings ----
const WORKER = 'https://eq-rs-talk-vote.swigertj.workers.dev';
const DEFAULT_SEASON = '2026-10';
const talksUrl = (season) => `data/${encodeURIComponent(season)}/talks.json`;

// ---- Helpers ----
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const params = new URLSearchParams(location.search);
const TOKEN = params.get('t') || '';
const PREVIEW = params.get('preview') === '1';

function seededOrder(items, seedText) {
  let h = 2166136261;
  for (const ch of seedText) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  let s = h >>> 0;
  const rand = () => { s += 0x6d2b79f5; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const a = items.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function whenText(iso) {
  return new Intl.DateTimeFormat('en-US', { timeZone: 'America/Denver', weekday: 'long', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }).format(new Date(iso));
}

// ---- State ----
const S = {
  info: null, talks: [], order: [], blind: false,
  triage: {}, points: {}, keepers: [], screen: 'welcome', error: '',
};
const draftKey = () => `tv:${S.info.season}:r${S.info.round}:${TOKEN || 'preview'}`;
function saveDraft() {
  try { localStorage.setItem(draftKey(), JSON.stringify({ triage: S.triage, points: S.points, keepers: S.keepers, blind: S.blind })); } catch (e) {}
}
function loadDraft() {
  try { const d = JSON.parse(localStorage.getItem(draftKey()) || 'null'); if (d) Object.assign(S, d); } catch (e) {}
}
const spent = () => Object.values(S.points).reduce((a, b) => a + b, 0);
// Spend at least 90% of the budget, but never more than the talks on this ballot can hold.
const floor = () => Math.min(Math.ceil(0.9 * S.info.budget), 5 * S.talks.filter((t) => !isPinned(t.id)).length);
const talk = (id) => S.talks.find((t) => t.id === id);
const isPinned = (id) => S.info.pins.includes(id);

// ---- Screens ----
function render() {
  const screen = $('#screen');
  const bar = $('#bar');
  bar.classList.add('hidden');
  if (S.screen === 'welcome') screen.innerHTML = welcome();
  if (S.screen === 'sort') { screen.innerHTML = sortScreen(); showBar('sort'); }
  if (S.screen === 'spend') { screen.innerHTML = spendScreen(); showBar('spend'); }
  if (S.screen === 'review') screen.innerHTML = reviewScreen();
  if (S.screen === 'done') screen.innerHTML = doneScreen();
  if (S.screen === 'closed') screen.innerHTML = closedScreen();
  wire();
}

function welcome() {
  const round2 = S.info.round > 1;
  return `<section class="panel">
    <h2>Hi ${esc(S.info.firstName)}!</h2>
    <p>${round2
      ? `A few Sundays still need talks. This short second round lists only the talks no one chose the first time.`
      : S.info.org === 'BISHOP'
        ? `The elders quorum and Relief Society presidencies are choosing this season's talks, and they would value your voice. Your vote is optional and very welcome.`
        : `The elders quorum and Relief Society presidencies are choosing this season's talks together.`}</p>
    <div class="purse-line"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><circle cx="17" cy="17" r="15" fill="var(--gold)"/><circle cx="17" cy="17" r="11" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2"/></svg><span>Like the servants in the parable, you've been given <b>${S.info.budget} talents</b>. Put them to work on the talks you'd most like to discuss.</span></div>
    <p>First sort the talks into Yes, Maybe, and Pass. Then spend your talents, from 1 to 5 per talk. About 20 minutes in all.</p>
    <p class="note">Voting closes ${esc(whenText(S.info.closesAt))}. Nobody sees anyone's choices until then.</p>
    <label class="toggle"><input type="checkbox" id="blind" ${S.blind ? 'checked' : ''}>
      <span>Hide speaker names while I sort<small>Some people find it easier to judge each message on its own.</small></span></label>
    <button class="primary" data-go="sort">Start sorting</button>
    ${PREVIEW ? '<p class="note" style="margin-top:16px">Preview mode: nothing will be saved or sent.</p>' : ''}
  </section>`;
}

function talkCard(t) {
  const pinned = isPinned(t.id);
  const v = S.triage[t.id];
  const who = S.blind ? '' : `<p class="who">${esc(t.speaker)}${t.session ? `, ${esc(t.session)}` : ''}${t.minutes ? `, about ${t.minutes} minutes` : ''}</p>`;
  return `<article class="talk" id="talk-${esc(t.id)}">
    <h3>${esc(t.title)}</h3>${who || '<p class="who"></p>'}
    <p class="summary">${esc(t.summary)}</p>
    ${t.url ? `<a class="read" href="${esc(t.url)}" target="_blank" rel="noopener">Read the full talk</a>` : ''}
    ${pinned ? '<p class="pinned">Already chosen for the season</p>' : `<div class="sort" role="group" aria-label="Sort this talk">
      ${['yes', 'maybe', 'pass'].map((x) => `<button data-sort="${esc(t.id)}" data-v="${x}" aria-pressed="${v === x}">${x[0].toUpperCase() + x.slice(1)}</button>`).join('')}
    </div>`}
  </article>`;
}

function sortScreen() {
  return `<p class="program">Program, part 1 of 3</p><h2>Sort the talks</h2>
    <p class="lead">Mark each talk Yes, Maybe, or Pass. You can change your mind at any point.</p>
    ${S.order.map((id) => talkCard(talk(id))).join('')}`;
}

function spendRow(id) {
  const t = talk(id), p = S.points[id] || 0, k = S.keepers.includes(id);
  const canKeep = S.info.round === 1 && p === 5 && (k || S.keepers.length < 2);
  return `<div class="row" id="row-${esc(id)}">
    <h3>${esc(t.title)}</h3>
    <div class="controls">
      <div class="pips" role="group" aria-label="Talents for this talk">
        ${[1, 2, 3, 4, 5].map((n) => `<button class="pip ${n <= p ? 'on' : ''}" data-pip="${esc(id)}" data-n="${n}" aria-label="Give ${n} talent${n > 1 ? 's' : ''}" aria-pressed="${n === p}">${n}</button>`).join('')}
      </div>
      ${S.info.round === 1 ? `<button class="keeper" data-keep="${esc(id)}" aria-pressed="${k}" ${canKeep || k ? '' : 'disabled'} title="A Keeper must carry 5 talents; up to two">${k ? '★ Keeper' : '☆ Keeper'}</button>` : ''}
    </div>
  </div>`;
}

function spendScreen() {
  const ids = S.order.filter((id) => !isPinned(id));
  const yes = ids.filter((id) => S.triage[id] === 'yes');
  const maybe = ids.filter((id) => S.triage[id] === 'maybe');
  const rest = ids.filter((id) => !['yes', 'maybe'].includes(S.triage[id]));
  return `<p class="program">Program, part 2 of 3</p><h2>Put your talents to work</h2>
    <p class="lead">Tap a number to give that many talents to a talk; tap it again to take them back.${S.info.round === 1 ? ' Mark up to two Keepers: talks you give a full 5 and want guaranteed a Sunday.' : ''}</p>
    ${yes.length ? `<p class="group">Your Yes talks</p>${yes.map(spendRow).join('')}` : ''}
    ${maybe.length ? `<p class="group">Your Maybe talks</p>${maybe.map(spendRow).join('')}` : ''}
    ${rest.length ? `<details class="passed"><summary>Talks you passed or didn't sort (${rest.length})</summary>${rest.map(spendRow).join('')}</details>` : ''}
    <button class="quiet" data-go="sort" style="margin-top:12px">Back to sorting</button>`;
}

function reviewScreen() {
  const chosen = Object.entries(S.points).filter(([, p]) => p > 0).sort((a, b) => b[1] - a[1]);
  return `<p class="program">Program, part 3 of 3</p><h2>Review and cast your ballot</h2>
    <p class="lead">You spent ${spent()} of ${S.info.budget} talents on ${chosen.length} talks.</p>
    <ul class="tally">${chosen.map(([id, p]) => `<li><span class="n">${p}</span><span class="t">${esc(talk(id).title)}${S.keepers.includes(id) ? '<span class="k">★ Keeper</span>' : ''}</span></li>`).join('')}</ul>
    ${spent() < floor() ? `<p class="error">Spend at least ${floor()} talents to cast your ballot. Tap Change talents to add more.</p>` : ''}
    ${S.error ? `<p class="error">${esc(S.error)}</p>` : ''}
    <div class="actions"><button class="quiet" data-go="spend">Change talents</button><button class="primary" id="cast" ${spent() < floor() ? 'disabled' : ''}>Cast my ballot</button></div>`;
}

function doneScreen() {
  return `<section class="panel well">
    <blockquote>Well done, thou good and faithful servant.</blockquote><cite>Matthew 25:21</cite>
    <h2>Your ballot is cast.</h2>
    <p>Thank you, ${esc(S.info.firstName)}. You can change it until ${esc(whenText(S.info.closesAt))}; just open your link again.</p>
    <p class="note">When voting closes, Presidents Sanderson and Spencer will receive the results and make the final assignments.</p>
    <button class="quiet" data-go="review">See my ballot</button></section>`;
}

function closedScreen() {
  return `<section class="panel"><h2>Voting has closed for this round.</h2>
    <p>Thank you${S.info?.firstName ? `, ${esc(S.info.firstName)}` : ''}. The presidencies will share the season's schedule once it's set.</p></section>`;
}

// ---- The talents bar ----
function setBoard(num, label) {
  const digits = String(Math.max(0, num)).padStart(2, '0').split('');
  $('#tiles').innerHTML = digits.map((d) => `<span class="tile">${d}</span>`).join('');
  $('#boardLabel').textContent = label;
}
function showBar(kind) {
  const bar = $('#bar'), next = $('#next');
  bar.classList.remove('hidden');
  if (kind === 'sort') {
    const sortable = S.order.filter((id) => !isPinned(id));
    const done = sortable.filter((id) => S.triage[id]).length;
    setBoard(done, 'sorted');
    $('#msg').innerHTML = done === sortable.length ? '<b>All sorted.</b> Time to spend your talents.' : `of <b>${sortable.length}</b> talks sorted`;
    next.textContent = 'Spend talents';
    next.disabled = false;
    next.onclick = () => go('spend');
  } else {
    updatePurse();
    next.textContent = 'Review';
    next.onclick = () => go('review');
  }
}
function updatePurse(message) {
  const left = S.info.budget - spent();
  const short = spent() < floor();
  setBoard(left, 'talents left');
  $('#msg').innerHTML = message || (short
    ? `of <b>${S.info.budget}</b>. <span class="warn">Spend at least ${floor()} to continue.</span>`
    : left === 0 ? '<b>Every talent is at work.</b>' : `of <b>${S.info.budget}</b>. Ready when you are.`);
  $('#next').disabled = short;
}

// ---- Actions ----
function go(screen) { S.error = ''; S.screen = screen; render(); window.scrollTo({ top: 0 }); }
function coinShower() {
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box = document.createElement('div'); box.className = 'shower';
  box.innerHTML = Array.from({ length: 28 }, (_, i) => `<i style="left:${(i * 37) % 100}%;animation-delay:${(i % 7) * 0.12}s;width:${12 + (i % 3) * 4}px;height:${12 + (i % 3) * 4}px"></i>`).join('');
  document.body.appendChild(box);
  setTimeout(() => box.remove(), 3400);
}

function setPoints(id, n) {
  const cur = S.points[id] || 0;
  const want = cur === n ? 0 : n;
  if (spent() - cur + want > S.info.budget) {
    updatePurse('<span class="warn">Your purse is empty.</span> Take talents from another talk first.');
    return;
  }
  if (want) S.points[id] = want; else delete S.points[id];
  if (want !== 5) S.keepers = S.keepers.filter((k) => k !== id);
  saveDraft();
  refreshRows();
  updatePurse();
}
function toggleKeeper(id) {
  if (S.keepers.includes(id)) S.keepers = S.keepers.filter((k) => k !== id);
  else if (S.keepers.length < 2 && S.points[id] === 5) S.keepers.push(id);
  saveDraft();
  refreshRows();
}
function refreshRows() {
  document.querySelectorAll('.row').forEach((row) => {
    const id = row.id.slice(4);
    const focusedPip = document.activeElement?.dataset?.pip === id ? document.activeElement.dataset.n : null;
    const focusedKeep = document.activeElement?.dataset?.keep === id;
    row.outerHTML = spendRow(id);
    const fresh = document.getElementById('row-' + id);
    if (focusedPip) fresh.querySelector(`[data-n="${focusedPip}"]`).focus();
    if (focusedKeep) fresh.querySelector('[data-keep]').focus();
  });
}

async function cast() {
  const body = { t: TOKEN, points: S.points, keepers: S.keepers, triage: S.triage };
  if (PREVIEW) { go('done'); coinShower(); return; }
  const btn = $('#cast'); btn.disabled = true; btn.textContent = 'Casting…';
  try {
    const r = await fetch(`${WORKER}/api/ballot`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'The ballot could not be saved.');
    go('done'); coinShower();
  } catch (e) {
    S.error = `${e.message} Your choices are still here; try again in a moment.`;
    render();
  }
}

function wire() {
  document.querySelectorAll('[data-go]').forEach((b) => (b.onclick = () => go(b.dataset.go)));
  const blind = $('#blind'); if (blind) blind.onchange = () => { S.blind = blind.checked; saveDraft(); };
  const c = $('#cast'); if (c) c.onclick = cast;
  $('#screen').onclick = (e) => {
    const s = e.target.closest('[data-sort]');
    if (s) {
      const id = s.dataset.sort, v = s.dataset.v;
      S.triage[id] = S.triage[id] === v ? undefined : v;
      if (!S.triage[id]) delete S.triage[id];
      saveDraft();
      s.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(S.triage[id] === b.dataset.v)));
      showBar('sort');
      return;
    }
    const p = e.target.closest('[data-pip]'); if (p) return setPoints(p.dataset.pip, Number(p.dataset.n));
    const k = e.target.closest('[data-keep]'); if (k) return toggleKeeper(k.dataset.keep);
  };
}

// ---- Start ----
async function start() {
  const screen = $('#screen');
  try {
    let all;
    if (PREVIEW) {
      const season = params.get('season') || DEFAULT_SEASON;
      const talksRes = await fetch(talksUrl(season), { cache: 'no-store' });
      if (!talksRes.ok) throw new Error('The talk list could not be loaded.');
      all = (await talksRes.json()).talks;
      S.info = { firstName: 'friend', org: 'EQ', season, round: 1, budget: Math.min(42, all.length * 3), closesAt: '2026-10-18T05:59:59Z', pins: [], eligible: all.map((t) => t.id), open: true, saved: null };
    } else {
      if (!TOKEN) { screen.innerHTML = '<section class="panel"><h2>Please open your personal link.</h2><p>This page works from the link you were sent, which is yours alone. If you can\'t find it, ask Jason for it again.</p></section>'; return; }
      const r = await fetch(`${WORKER}/api/ballot?t=${encodeURIComponent(TOKEN)}`);
      const data = await r.json();
      if (!r.ok) {
        screen.innerHTML = `<section class="panel"><h2>This link didn't work.</h2><p>${esc(data.error || '')} Check that you opened the whole link, or ask Jason for a fresh one.</p></section>`;
        return;
      }
      S.info = data;
      const talksRes = await fetch(talksUrl(data.season), { cache: 'no-store' });
      if (!talksRes.ok) throw new Error('The talk list could not be loaded.');
      all = (await talksRes.json()).talks;
    }
    S.talks = all.filter((t) => S.info.eligible.includes(t.id) || S.info.pins.includes(t.id));
    S.order = seededOrder(S.talks.map((t) => t.id), TOKEN || 'preview');
    loadDraft();
    if (S.info.saved) {
      S.points = S.info.saved.points || {};
      S.keepers = S.info.saved.keepers || [];
      S.triage = Object.keys(S.info.saved.triage || {}).length ? S.info.saved.triage : S.triage;
    }
    if (!S.info.open) S.screen = 'closed';
    else if (S.info.saved) S.screen = 'done';
    render();
  } catch (e) {
    screen.innerHTML = `<section class="panel"><h2>The ballot didn't load.</h2><p>${esc(e.message)} Check your connection and reload the page.</p></section>`;
  }
}
start();
</script>
</body>
</html>
