# Only needed if you deploy from a computer with `npx wrangler deploy`.
# Dashboard users: enter the same values under Settings (see SETUP.md).
name = "eq-rs-talk-vote"
main = "worker.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "BALLOTS"
id = "960cbc6ef1914667a2049e1a3a83b7ac"   # eq-rs-talk-vote (created 2026-10-03)

[triggers]
# Cron runs in UTC; the Worker acts only on whichever run is 6:00 AM in St. George.
crons = ["0 12 * * *", "0 13 * * *"]

[vars]
SEASON = "2026-10"
ROUND = "1"
BUDGET = "42"                         # 2 points x 21 lesson Sundays
SLOTS = "21"
CLOSES_AT = "2026-10-18T05:59:59Z"    # 11:59 PM Sat Oct 17, Utah time
ALLOWED_ORIGIN = "https://jasonswigert.github.io"
TALKS_URL = "https://jasonswigert.github.io/talk-vote/data/{season}/talks.json"
PINS = "[]"
ANONYMOUS = "false"
TRELLO_LIST_ID = "6ac15b0909c6990f5cd7a795"   # Elder's Quorum board, Inbox
# Secrets (set with `npx wrangler secret put NAME`, never here):
# VOTERS, ADMIN_KEY, DROPBOX_APP_KEY, DROPBOX_APP_SECRET, DROPBOX_REFRESH_TOKEN, TRELLO_KEY, TRELLO_TOKEN
